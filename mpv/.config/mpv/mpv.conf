# ---- Core rendering ----
vo=gpu-next
profile=high-quality

# ---- Hardware decoding ----
hwdec=auto

# ---- Quality extras ----
deband=yes

# ---- Behavior ----
idle=no
keep-open-pause=no
osd-duration=1500

# ---- OSC ----
osc=no

# ---- Screenshots ----
screenshot-format=png
screenshot-directory=~/pictures/screenshots
screenshot-template="%tY-%tm-%td_%tH:%tM:%tS"
