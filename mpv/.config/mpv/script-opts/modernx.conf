# --- Layout & buttons ---
compact_mode=no
jump_buttons=yes
jump_amount=10
jump_more_amount=60
chapter_skip_buttons=yes
track_nextprev_buttons=yes
volume_control=yes
volume_control_type=logarithmic
info_button=yes
ontop_button=yes
screenshot_button=yes
screenshot_flag=subtitles
download_button=yes
download_path=~/videos
loop_button=yes
playpause_size=30
midbuttons_size=24
sidebuttons_size=24

# --- Visibility & behavior ---
hide_timeout=1500
seek_resets_hide_timeout=yes
fade_duration=150
bottom_hover=yes
bottom_hover_zone=175
show_on_pause=yes
keep_on_pause=no
mouse_seek_pause=yes
persistent_progress_default=no
persistent_progress_toggle=yes

# --- Title, time, description ---
show_title=yes
title=${media-title}
title_font_size=28
dynamic_title=yes
show_chapter_title=yes
show_chapter_markers=yes
chapter_marker_style=gap
show_description=yes
show_file_size=yes
description_font_size=19
scrolling_speed=40
time_total=yes
time_format=dynamic
time_font_size=18

# --- Window top bar (borderless/fullscreen mode; OS border kept on windowed) ---
window_top_bar=auto
window_title=yes
window_controls=yes

# --- Subtitles ---
raise_subtitles=yes
raise_subtitle_amount=160

# --- Theme ---
osc_color=#0a0a0a
title_color=#7b7b7b
time_color=#7b7b7b
chapter_title_color=#7b7b7b
side_buttons_color=#7b7b7b
middle_buttons_color=#7b7b7b
playpause_color=#7b7b7b
window_title_color=#7b7b7b
window_controls_color=#7b7b7b
hover_effect_color=#9ccbfb
held_element_color=#808080
seekbarfg_color=#9ccbfb
seekbarbg_color=#7b7b7b
seekbar_cache_color=#9ccbfb
chapter_marker_color=#9ccbfb
chapter_marker_current_color=#9ccbfb
