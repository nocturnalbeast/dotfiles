# rift config - full AeroSpace-parity replacement (runtime-exclusive with AeroSpace)
# Layout judgment per workspace from AeroSpace routing rules:
#   main  master_stack (active conversation master, rest stacked)
#   inet  bsp          (co-equal browser windows)
#   code  bsp          (classic dev tiling)
#   data  bsp          (co-equal DB/SSH tools)
#   play  master_stack (big edit canvas + secondaries)
#   docs  master_stack (focused document, rest stacked)
#   draw/txns/info/misc bsp (trivial single-app)

[settings]
# Animations (rift's headline UX vs aerospace - both ON per decision)
animate = true
animation_duration = 0.2
animation_fps = 100.0

# Spaces opt-in: default_disable=true means new spaces start unmanaged.
# For full-replacement usage we manage from the start → false.
default_disable = false

# Mouse behavior (aerospace had focus-follows-mouse off; rift's warping
# pair is the better default - flip to false if it fights muscle memory)
focus_follows_mouse = false
mouse_follows_focus = true
mouse_hides_on_focus = false

# Don't let these steal focus / bounce workspaces
auto_focus_blacklist = [
  "com.apple.Spotlight",
  "com.apple.dock",
  "com.apple.systemuiserver",
  "com.apple.SecurityAgent",
  "com.raycast.macos",
]

# Startup integrations:
# 1. pow-af: auto-focus previous occupied workspace when current empties
#    (surviving script from the lost config - proven wiring restored)
# 2. sketchybar triggers (rift workspace/windows events; the bar item is
#    deferred per decision, but the events are cheap to emit now)
run_on_start = [
  "rift-cli subscribe cli --event windows_changed --command ~/.dotfiles/scripts/.local/bin/rift-pow-af",
  "rift-cli subscribe cli --event workspace_changed --command sh --args -c --args 'sketchybar --trigger rift_workspace_changed RIFT_WORKSPACE_NAME=\"$RIFT_WORKSPACE_NAME\" RIFT_WORKSPACE_ID=\"$RIFT_WORKSPACE_ID\" 2>/dev/null'",
]

# Hot reload (defaults true; explicit for clarity)
hot_reload = true

[settings.layout]
# Default engine for unruled workspaces; per-workspace overrides below.
mode = "bsp"
window_insertion_point = "next_to_selection"

[settings.layout.traditional]
equalize_nodes = true

[settings.layout.master_stack]
master_ratio = 0.6
master_count = 1
master_side = "left"
new_window_placement = "stack"

# Gaps - mirror AeroSpace: inner 10, outer 10, top 48 clears the sketchybar
# overlay bar (bar floats via topmost, but aerospace reserved 48 for it and
# the visual result was right)
[settings.layout.gaps.outer]
# GLOBAL default: externals have no menu-bar inset (frame y=0), so the full
# sketchybar clearance (44) comes from the gap itself. Any external display
# that's ever connected gets this automatically.
top = 44
left = 10
bottom = 10
right = 10

# Built-in Retina (primary): rift auto-reserves the menu bar (frame y=38),
# so it only needs a small extra gap → window-top = 38 + 4 = 42.
# A per_display override REPLACES the whole outer group - all four edges
# required. UUID from `rift-cli query displays` (stable for built-ins).
[settings.layout.gaps.per_display."37D8832A-2D66-02CA-B9F7-8F30A301B230".outer]
top = 4
left = 10
bottom = 10
right = 10

[settings.layout.gaps.inner]
horizontal = 10
vertical = 10

# Menubar indicators off - sketchybar is the bar
[settings.ui.menu_bar]
enabled = false

[settings.ui.stack_line]
enabled = false

[settings.ui.mission_control]
enabled = true
fade_enabled = true
fade_duration_ms = 180.0

# 3-finger trackpad workspace swipes (haptics on, skip-empty on)
[settings.gestures]
enabled = true
consume_dock_swipe = true
invert_horizontal_swipe = false
swipe_vertical_tolerance = 0.4
skip_empty = true
fingers = 3
distance_pct = 0.08
haptics_enabled = true
haptic_pattern = "level_change"

[settings.window_snapping]
drag_swap_fraction = 0.3

[virtual_workspaces]
enabled = true
default_workspace_count = 10
auto_assign_windows = true
preserve_focus_per_workspace = true
workspace_auto_back_and_forth = true
prevent_wrapping = false
reapply_app_rules_on_title_change = false

# AeroSpace's 10 named workspaces, same order (rift: 0-based indices)
workspace_names = [
  "main",
  "inet",
  "code",
  "data",
  "play",
  "docs",
  "draw",
  "txns",
  "info",
  "misc",
]
default_workspace = 2 # "code" - the dev home

workspace_rules = [
  { workspace = 0, layout = "master_stack" }, # main
  { workspace = 1, layout = "bsp" },          # inet
  { workspace = 2, layout = "bsp" },          # code
  { workspace = 3, layout = "bsp" },          # data
  { workspace = 4, layout = "master_stack" }, # play
  { workspace = 5, layout = "master_stack" }, # docs
  { workspace = 6, layout = "bsp" },          # draw
  { workspace = 7, layout = "bsp" },          # txns
  { workspace = 8, layout = "bsp" },          # info
  { workspace = 9, layout = "bsp" },          # misc
]

# App rules - ported 1:1 from AeroSpace on-window-detected routing
# (aerospace names → 0-based indices: main=0 inet=1 code=2 data=3 play=4
#  docs=5 draw=6 txns=7 info=8 misc=9)
app_rules = [
  # main
  { app_id = "com.microsoft.Outlook", workspace = 0 },
  { app_id = "com.microsoft.teams2", workspace = 0 },
  { app_id = "com.tinyspeck.slackmacgap", workspace = 0 },
  # inet
  { app_id = "org.mozilla.firefox", workspace = 1 },
  { app_id = "com.google.Chrome", workspace = 1 },
  { app_id = "com.apple.Safari", workspace = 1 },
  # code
  { app_id = "net.kovidgoyal.kitty", workspace = 2 },
  { app_id = "com.googlecode.iterm2", workspace = 2 },
  { app_id = "dev.zed.Zed", workspace = 2 },
  { app_id = "com.microsoft.VSCode", workspace = 2 },
  { app_id = "com.sublimemerge", workspace = 2 },
  { app_id = "dev.openchamber.desktop", workspace = 2 },
  # data
  { app_id = "com.mongodb.compass", workspace = 3 },
  { app_id = "me.qii404.another-redis-desktop-manager", workspace = 3 },
  { app_id = "org.localsend.localsendApp", workspace = 3 },
  { app_id = "com.emtec.zoc9", workspace = 3 },
  # play
  { app_id = "org.kde.Kdenlive", workspace = 4 },
  { app_id = "com.apple.iMovieApp", workspace = 4 },
  # docs
  { app_id = "org.libreoffice.script", workspace = 5 },
  { app_id = "com.microsoft.Word", workspace = 5 },
  { app_id = "com.microsoft.Excel", workspace = 5 },
  { app_id = "com.microsoft.Powerpoint", workspace = 5 },
  { app_id = "com.microsoft.onenote.mac", workspace = 5 },
  { app_id = "com.apple.iWork.Pages", workspace = 5 },
  { app_id = "com.apple.iWork.Keynote", workspace = 5 },
  { app_id = "com.logseq.logseq", workspace = 5 },
  # draw
  { app_id = "com.jgraph.drawio.desktop", workspace = 6 },
  # txns
  { app_id = "net.whatsapp.WhatsApp", workspace = 7 },
  # info
  { app_id = "com.apple.ActivityMonitor", workspace = 8 },
  { app_id = "ai.elementlabs.lmstudio", workspace = 8 },
  { app_id = "com.dalcu.mlx-core", workspace = 8 },
  { app_id = "com.youssofal.mtplx", workspace = 8 },
  { app_id = "dev.kdrag0n.MacVirt", workspace = 8 },
  # misc
  # 1Password: routed to misc AND floating (aerospace check-further equivalent:
  # rift rules are single-action, so this floating rule is MORE specific
  # (name match) and wins over a generic id rule if both existed)
  { app_id = "com.1password.1password", workspace = 9, floating = true },
  { app_id = "pro.betterdisplay.BetterDisplay", workspace = 9 },
  { app_id = "org.hammerspoon.Hammerspoon", workspace = 9 },
  { app_id = "com.box.desktop", workspace = 9 },
  { app_id = "org.openvpn.client.app", workspace = 9 },
  { app_id = "org.zaproxy.zap.ZAP", workspace = 9 },
  { app_id = "com.cisco.secureclient.gui", workspace = 9 },
  # floaters (no workspace - just float)
  { app_id = "com.apple.finder", floating = true },
  { app_id = "com.apple.systempreferences", floating = true },
]

# ============================================================================
# Keys - meh = Ctrl+Alt+Meta (mirrors AeroSpace's Karabiner caps-lock map)
# meh+shift adds Shift. Same muscle memory in both WMs.
# ============================================================================
[modifier_combinations]
meh = "Ctrl + Alt + Meta"
mehs = "Ctrl + Alt + Meta + Shift" # meh + shift

[keys]
# --- Focus (meh + h/j/k/l, arrows) - aerospace parity incl. arrows ---
"meh + H" = { move_focus = "left" }
"meh + J" = { move_focus = "down" }
"meh + K" = { move_focus = "up" }
"meh + L" = { move_focus = "right" }
"meh + Left" = { move_focus = "left" }
"meh + Down" = { move_focus = "down" }
"meh + Up" = { move_focus = "up" }
"meh + Right" = { move_focus = "right" }

# --- Move window (meh+shift + h/j/k/l, arrows) - aerospace parity ---
"mehs + H" = { move_node = "left" }
"mehs + J" = { move_node = "down" }
"mehs + K" = { move_node = "up" }
"mehs + L" = { move_node = "right" }
"mehs + Left" = { move_node = "left" }
"mehs + Down" = { move_node = "down" }
"mehs + Up" = { move_node = "up" }
"mehs + Right" = { move_node = "right" }

# --- Workspace switching (meh + 1..0 → main..misc, auto-back-and-forth on) ---
"meh + 1" = { switch_to_workspace = 0 }
"meh + 2" = { switch_to_workspace = 1 }
"meh + 3" = { switch_to_workspace = 2 }
"meh + 4" = { switch_to_workspace = 3 }
"meh + 5" = { switch_to_workspace = 4 }
"meh + 6" = { switch_to_workspace = 5 }
"meh + 7" = { switch_to_workspace = 6 }
"meh + 8" = { switch_to_workspace = 7 }
"meh + 9" = { switch_to_workspace = 8 }
"meh + 0" = { switch_to_workspace = 9 }

# --- Move window to workspace (meh+shift + digit), following the window
#     (aerospace's --focus-follows-window semantics) ---
"mehs + 1" = { move_window_to_workspace = { workspace = 0, follow = true } }
"mehs + 2" = { move_window_to_workspace = { workspace = 1, follow = true } }
"mehs + 3" = { move_window_to_workspace = { workspace = 2, follow = true } }
"mehs + 4" = { move_window_to_workspace = { workspace = 3, follow = true } }
"mehs + 5" = { move_window_to_workspace = { workspace = 4, follow = true } }
"mehs + 6" = { move_window_to_workspace = { workspace = 5, follow = true } }
"mehs + 7" = { move_window_to_workspace = { workspace = 6, follow = true } }
"mehs + 8" = { move_window_to_workspace = { workspace = 7, follow = true } }
"mehs + 9" = { move_window_to_workspace = { workspace = 8, follow = true } }
"mehs + 0" = { move_window_to_workspace = { workspace = 9, follow = true } }

# --- Last workspace (aerospace: meh+tab workspace-back-and-forth) ---
"meh + Tab" = "switch_to_last_workspace"

# --- Resize: no modes in rift; smart grow/shrink replaces aerospace's
#     resize-mode + step bindings. meh+minus/equal = aerospace parity. ---
"meh + Minus" = "resize_window_shrink"
"meh + Equal" = "resize_window_grow"
# smart variant picks the nearest split automatically
"mehs + Minus" = { resize_window_shrink = "smart" }
"mehs + Equal" = { resize_window_grow = "smart" }

# --- Layout cycling (aerospace: meh+m cycled 4 layouts) - rift equivalent:
#     hot-set the engine. meh+m cycles traditional→bsp→stack→master_stack. ---
"meh + M" = { exec = ["/bin/sh", "-c", "$HOME/.config/rift/cycle-layout.sh"] }

# --- Fullscreen / float (aerospace parity) ---
"meh + F" = "toggle_fullscreen_within_gaps"
"mehs + F" = "toggle_window_floating"

# --- Joining (rift-native nicety aerospace lacked; meh+shift arrows are
#     taken by move-node. Ctrl+Alt (no Meta) is distinct from every meh
#     chord - adding Meta/Ctrl/Alt to meh collapses into it) ---
"Ctrl + Alt + Left" = { join_window = "left" }
"Ctrl + Alt + Right" = { join_window = "right" }
"Ctrl + Alt + Up" = { join_window = "up" }
"Ctrl + Alt + Down" = { join_window = "down" }
"Ctrl + Alt + E" = "unjoin_windows"

# --- Container toggles (aerospace's layout h/v toggles ≈ rift's) ---
"meh + Comma" = "toggle_stack"
"meh + Slash" = "toggle_orientation"

# --- Close (aerospace: meh+q quit-if-last, meh+shift+q close) ---
"meh + Q" = { exec = ["/bin/sh", "-c", "$HOME/.config/rift/close-window.sh"] }
"mehs + Q" = "close_window"

# --- Space management (rift-specific; safe additions) ---
"meh + Z" = "toggle_space_activated"
"meh + C" = "create_workspace"

# --- Spawn (aerospace parity: meh+enter kitty, meh+w firefox, meh+e finder) ---
"meh + Enter" = { exec = ["/usr/bin/open", "-n", "/Applications/kitty.app"] }
"meh + W" = { exec = ["/usr/bin/open", "-n", "/Applications/Firefox.app"] }
"meh + E" = { exec = ["/usr/bin/open", "~"] }

# --- Reload / pause (aerospace parity: meh+esc reload; meh+shift+e enable-toggle
#     has no rift analog - rift IS the manager; use save_and_exit for quit) ---
"meh + Esc" = "reload_config"

# --- Mission control (rift's own exploded view) - Ctrl+Alt variants stay
#     clear of meh+M (cycle-layout) and mehs+M (promote-to-master) ---
"Ctrl + Alt + M" = "show_mission_control_all"
"Ctrl + Alt + Shift + M" = "show_mission_control_current"

# --- Master-stack adjustments (only active on master_stack workspaces) ---
# Key names: rift doesn't support BracketLeft/BracketRight - use I/O
# (vim/dwm mnemonic). meh+I/O = master ratio; mehs+I/O = master count.
# 0.5.3 quirk: config-key forms of adjust_master_* don't parse (main-branch
# wiki skew) - exec the CLI subcommands instead (verified in 0.5.3 help).
"meh + I" = { exec = [
  "/opt/homebrew/bin/rift-cli",
  "execute",
  "layout",
  "adjust-master-ratio",
  "0.05",
] }
"meh + O" = { exec = [
  "/opt/homebrew/bin/rift-cli",
  "execute",
  "layout",
  "adjust-master-ratio",
  "-0.05",
] }
"mehs + I" = { exec = [
  "/opt/homebrew/bin/rift-cli",
  "execute",
  "layout",
  "adjust-master-count",
  "1",
] }
"mehs + O" = { exec = [
  "/opt/homebrew/bin/rift-cli",
  "execute",
  "layout",
  "adjust-master-count",
  "-1",
] }
"mehs + M" = "promote_to_master"

# --- Scrolling-layout niceties (harmless on other engines; future-proof
#     for when a workspace is flipped to scrolling) ---
"Ctrl + Alt + Shift + Left" = { scroll_strip = { delta = -0.5 } }
"Ctrl + Alt + Shift + Right" = { scroll_strip = { delta = 0.5 } }
"Ctrl + Alt + C" = "center_selection"

# --- Debug ---
"mehs + D" = "debug"
