# theme system configuration — source of truth (00 §3)
# Hand-authored static palette (05 §2 minimal form): mode + accent +
# dual complete base16 variants; colors optional.

gui:
  theme: colloid
  tweaks: [black, rimless]
  size: standard
  icon_pack: tela
  cursor_pack: bibata_original
  cursor_size: 24
  env_override: false
  font_size: 12

fonts:
  sans: [Inter Display, Inter Tight, Inter, Noto Sans, JoyPixels, Symbola]
  serif: [Libre Baskerville, Noto Serif, JoyPixels, Symbola]
  monospace: [VictorMono Nerd Font, Noto Sans Mono, JoyPixels, Symbola]

tui:
  scheme: follow
  mode: auto
  approx_threshold: 5.0

wallpaper:
  sync: true
  tracker: ~/.config/wm/current_wallpaper
  on_change: [all]

